<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複式簿記 家計簿</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f1efe8">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f1efe8;
    color: #1a1a1a;
    margin: 0;
    padding: 12px;
  }
  .container { max-width: 780px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #d3d1c7;
    background: transparent;
    color: #1a1a1a;
    cursor: pointer;
    font-size: 14px;
  }
  .tab-btn.active { background: #fff; border-color: #888780; font-weight: 600; }
  .card {
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  label { font-size: 13px; color: #5f5e5a; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%;
    height: 38px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    padding: 0 10px;
    font-size: 14px;
    background: #fff;
    color: #1a1a1a;
  }
  .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; min-width: 130px; }
  button.primary {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    color: #1a1a1a;
  }
  button.link {
    border: none;
    background: transparent;
    color: #a32d2d;
    cursor: pointer;
    font-size: 13px;
    padding: 4px;
  }
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #888780; }
  td { padding: 6px 4px; border-bottom: 1px solid #d3d1c7; }
  .num { text-align: right; }
  .error {
    background: #fcebeb;
    color: #791f1f;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  h3 { margin-top: 0; font-size: 16px; }
  .muted { color: #888780; font-size: 14px; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .kv.total { font-weight: 600; border-top: 1px solid #888780; margin-top: 4px; padding-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) {
    .grid2 { grid-template-columns: 1fr; }
  }
  .login-screen { max-width: 400px; margin: 80px auto; text-align: center; }
  .login-screen h2 { font-size: 18px; margin-bottom: 8px; }
  .login-screen p { color: #5f5e5a; font-size: 14px; margin-bottom: 24px; }
  button.google {
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: #5f5e5a;
    flex-wrap: wrap;
    gap: 8px;
  }
  .book-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .book-bar select { flex: 1 1 200px; }
  .period-bar { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; }
  .period-bar .field { flex: 1 1 140px; }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    max-width: 360px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  .modal .row { margin-bottom: 16px; }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cal-header h3 { margin: 0; }
  .cal-header button {
    border: 1px solid #d3d1c7;
    background: #fff;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 15px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow {
    text-align: center;
    font-size: 12px;
    color: #888780;
    padding: 4px 0;
  }
  .cal-cell {
    border: 1px solid #e5e3da;
    border-radius: 6px;
    min-height: 56px;
    padding: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .cal-cell.empty { border: none; cursor: default; }
  .cal-cell.today { border-color: #1a1a1a; border-width: 2px; }
  .cal-cell:hover:not(.empty) { background: #f7f6f2; }
  .cal-date { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .cal-delta-plus { color: #1b7a3d; }
  .cal-delta-minus { color: #a32d2d; }
  .cal-week-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border: 1px solid #e5e3da;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .cal-week-row:hover { background: #f7f6f2; }
  .cal-total-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #f7f6f2;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .cal-total-bar:hover { background: #efede5; }
  .cal-week-row.today { border-color: #1a1a1a; border-width: 2px; }
  .cal-week-date { width: 48px; text-align: center; }
  .cal-week-dow { font-size: 11px; color: #888780; }
  .cal-week-body { flex: 1; display: flex; gap: 16px; }
  .cal-week-count { font-size: 12px; color: #5f5e5a; min-width: 32px; text-align: right; }
  .cal-day-head { display: flex; gap: 32px; }
  /* 人物入力・検索 */
  .ppl-box { display:flex; flex-wrap:wrap; align-items:center; gap:6px; border:1px solid #d3d1c7; border-radius:8px; padding:4px 6px; background:#fff; min-height:38px; box-sizing:border-box; }
  .ppl-box:focus-within { border-color:#888780; }
  .ppl-box input { flex:1 1 90px; min-width:90px; width:auto; height:28px; border:none; padding:0 4px; outline:none; font-size:14px; }
  .ppl-chip { display:inline-flex; align-items:center; gap:2px; background:#efede5; border-radius:14px; padding:3px 4px 3px 10px; font-size:13px; }
  .ppl-chip button { border:none; background:transparent; cursor:pointer; color:#5f5e5a; font-size:14px; line-height:1; padding:2px 6px; }
  .ppl-add { border:1px solid #d3d1c7; background:#fff; border-radius:8px; font-size:12px; padding:0 10px; height:28px; cursor:pointer; color:#1a1a1a; }
  .ppl-suggest { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .ppl-suggest:empty { display:none; }
  .ppl-suggest .lbl { font-size:11px; color:#888780; align-self:center; }
  .ppl-pill { border:1px solid #d3d1c7; background:#fff; border-radius:14px; padding:4px 10px; font-size:13px; cursor:pointer; color:#1a1a1a; }
  .ppl-pill:hover, .ppl-pill.active { background:#f1efe8; border-color:#888780; }
  .ppl-pill.new { border-style:dashed; }
  .ppl-line { font-size:11px; color:#5f5e5a; margin-top:2px; }
  .search-card .row { margin-bottom:10px; }
  .search-card .row:last-child { margin-bottom:0; }
  /* 週リスト（週ビュー） */
  .week-list-card { padding: 10px; }
  .week-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 72px;
    box-sizing: border-box;
    padding: 0 14px;
    border: 1px solid #e5e3da;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fff;
  }
  .week-card:last-child { margin-bottom: 0; }
  .week-card:hover, .week-card:active { background: #f7f6f2; }
  .week-card.current { border-color: #1a1a1a; border-width: 2px; }
  .week-card-range { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .week-card-sub { font-size: 11px; color: #888780; margin-top: 3px; }
  .week-card-right { text-align: right; }
  .week-card-net { font-size: 17px; font-weight: 700; }
  .week-card-detail { font-size: 11px; margin-top: 3px; display: flex; gap: 8px; justify-content: flex-end; }
  .week-net-zero { color: #888780; }
  /* 月ビューの横スワイプ */
  .swipe-area { touch-action: pan-y; }
  @keyframes slideInNext { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideInPrev { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
  .swipe-area.slide-next { animation: slideInNext 0.22s ease-out; }
  .swipe-area.slide-prev { animation: slideInPrev 0.22s ease-out; }
  .period-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .period-toggle button.active { background: #fff; border-color: #888780; font-weight: 600; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="login-screen">
    <h2>複式簿記 家計簿</h2>
    <p>読み込み中...</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const DEFAULT_ACCOUNTS = [
  { name: '現金', type: 'asset' },
  { name: '普通預金', type: 'asset' },
  { name: '食費', type: 'expense' },
  { name: '住居費', type: 'expense' },
  { name: '水道光熱費', type: 'expense' },
  { name: '通信費', type: 'expense' },
  { name: '交際費', type: 'expense' },
  { name: '被服費', type: 'expense' },
  { name: '教材費', type: 'expense' },
  { name: '娯楽費', type: 'expense' },
  { name: '交通費', type: 'expense' },
  { name: '雑費', type: 'expense' },
  { name: '仕送り', type: 'revenue' },
  { name: 'アルバイト収入', type: 'revenue' },
  { name: '奨学金', type: 'liability' },
];

const TYPE_LABEL = { asset: '資産', liability: '負債', equity: '純資産', revenue: '収益', expense: '費用' };
const TYPE_ORDER = ['asset', 'liability', 'equity', 'revenue', 'expense'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function normalDebit(type) { return type === 'asset' || type === 'expense'; }
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
function pad2(n) { return String(n).padStart(2, '0'); }
function dateToStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function strToDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
// ローカルタイムゾーン基準の今日（toISOStringだとUTC基準になり、日本時間の午前0〜9時に前日になる）
function todayStr() { return dateToStr(new Date()); }
function addDays(dateStr, n) { const d = strToDate(dateStr); d.setDate(d.getDate() + n); return dateToStr(d); }
function addMonths(dateStr, n) {
  const d = strToDate(dateStr);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return dateToStr(d);
}
// 日曜始まりの週の開始日
function startOfWeek(dateStr) { const d = strToDate(dateStr); d.setDate(d.getDate() - d.getDay()); return dateToStr(d); }
const DOW_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
function firstOfMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
}

// 年度基準（4月始まり）のユーティリティ
function fiscalYearOf(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  return m >= 4 ? y : y - 1;
}
function fiscalQuarterOf(dateStr) {
  const [, m] = dateStr.split('-').map(Number);
  // 4-6:Q1, 7-9:Q2, 10-12:Q3, 1-3:Q4
  if (m >= 4 && m <= 6) return 1;
  if (m >= 7 && m <= 9) return 2;
  if (m >= 10 && m <= 12) return 3;
  return 4;
}
function fiscalQuarterRange(fy, q) {
  // fyは年度開始年（例: 2026年度 = 2026-04-01始まり）
  const starts = { 1: [fy, 4], 2: [fy, 7], 3: [fy, 10], 4: [fy + 1, 1] };
  const [sy, sm] = starts[q];
  const ey = sm === 10 ? sy : (sm === 1 ? sy : sy);
  const em = sm + 2;
  const startStr = sy + '-' + String(sm).padStart(2, '0') + '-01';
  const endYear = sm + 2 > 12 ? sy + 1 : sy;
  const endMonth = ((sm + 2 - 1) % 12) + 1;
  const lastDay = new Date(endYear, endMonth, 0).getDate();
  const endStr = endYear + '-' + String(endMonth).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0');
  return [startStr, endStr];
}
function fiscalYearRange(fy) {
  return [fy + '-04-01', (fy + 1) + '-03-31'];
}
function calendarYearRange(y) {
  return [y + '-01-01', y + '-12-31'];
}
function calendarQuarterOf(dateStr) {
  const [, m] = dateStr.split('-').map(Number);
  return Math.ceil(m / 3);
}
function calendarQuarterRange(y, q) {
  const startMonth = (q - 1) * 3 + 1;
  const endMonth = startMonth + 2;
  const lastDay = new Date(y, endMonth, 0).getDate();
  return [
    y + '-' + String(startMonth).padStart(2, '0') + '-01',
    y + '-' + String(endMonth).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0'),
  ];
}

let state = {
  user: null,
  books: [],
  currentBookId: null,
  tab: 'entry',
  error: '',
  periodStart: todayStr(),
  periodEnd: todayStr(),
  form: { date: todayStr(), memo: '', debit: '', credit: '', amount: '', people: [] },
  journalQuery: '', // 仕訳帳の摘要検索
  journalPeople: [], // 仕訳帳の人物絞り込み（AND）
  viewingPeople: [],
  accForm: { name: '', type: 'expense' },
  modal: null,
  calendarView: 'month', // 'day' | 'week' | 'month'
  calendarAnchor: todayStr(), // 表示の基準日 'YYYY-MM-DD'
  daySummaryMode: 'summary', // 'summary'（科目別増減）| 'entries'（その日の仕訳）
  selectedDate: null,
  selectedRange: null, // { start, end, label } 週・月単位でモーダルを開く用。日単位は selectedDate を使う
  periodSummaryMode: 'month', // 'month' | 'quarter' | 'year'
  periodSummaryMonth: firstOfMonthStr().slice(0, 7), // 'YYYY-MM'
  periodSummaryFY: fiscalYearOf(todayStr()),
  periodSummaryQ: fiscalQuarterOf(todayStr()),
  periodBasis: 'fiscal', // 'fiscal' | 'calendar'
  pdfExportYear: new Date().getFullYear(),
  pdfExporting: false,
  editingAccountId: null,
  viewingMemo: null,
  confirmEntryId: null,
  confirmPurgeId: null,
  editingEntryId: null,
  entryDraft: null,
  returnModal: null,
};

function currentBook() {
  return state.books.find(b => b.id === state.currentBookId);
}

function userDocRef() {
  return db.collection('users').doc(state.user.uid);
}

function newDefaultBook(name) {
  return {
    id: uid(),
    name: name || '家計簿',
    accounts: DEFAULT_ACCOUNTS.map(a => ({ ...a, id: uid() })),
    entries: [],
    trash: [],
  };
}

async function loadUserData() {
  const doc = await userDocRef().get();
  if (doc.exists) {
    const data = doc.data();
    if (data.books && data.books.length > 0) {
      state.books = data.books;
    } else if (data.accounts || data.entries) {
      const migrated = {
        id: uid(),
        name: 'デフォルト帳簿',
        accounts: data.accounts || DEFAULT_ACCOUNTS.map(a => ({ ...a, id: uid() })),
        entries: data.entries || [],
      };
      state.books = [migrated];
      await saveUserData();
    } else {
      state.books = [newDefaultBook()];
      await saveUserData();
    }
  } else {
    state.books = [newDefaultBook()];
    await saveUserData();
  }
  state.currentBookId = state.books[0].id;
  purgeOldTrash();
}

// 各帳簿のゴミ箱をチェックし、削除から30日超過したものを完全削除する
function purgeOldTrash() {
  const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  let changed = false;
  state.books.forEach(book => {
    if (!book.trash || book.trash.length === 0) return;
    const before = book.trash.length;
    book.trash = book.trash.filter(e => {
      if (!e.deletedAt) return true;
      return (now - new Date(e.deletedAt).getTime()) < THIRTY_DAYS_MS;
    });
    if (book.trash.length !== before) changed = true;
  });
  if (changed) saveUserData();
}

function saveUserData() {
  return userDocRef().set({
    books: state.books,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-screen">
      <h2>複式簿記 家計簿</h2>
      <p>Googleアカウントでログインすると、どの端末からでも同じデータにアクセスできます。</p>
      <button class="google" id="google-login">Googleでログイン</button>
    </div>
  `;
  document.getElementById('google-login').onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
      alert('ログインに失敗しました: ' + err.message);
    });
  };
}

const APP_BUILD = '2026-09-28-d';

// サービスワーカーとキャッシュをすべて破棄して読み込み直す
async function forceUpdateApp() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.reload();
}

function renderLoading(msg) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="login-screen"><h2>複式簿記 家計簿</h2><p>${msg}</p></div>`;
}

function render() {
  if (!state.user) { renderLogin(); return; }

  const app = document.getElementById('app');
  // カレンダーで同じ表示のまま再描画される場合（モーダル開閉など）はスクロール位置を維持する
  const keepScroll = state.tab === 'calendar' && state._renderedKey === 'calendar:' + state.calendarView;
  const prevScrollY = window.scrollY;
  app.innerHTML = '';

  const topbar = document.createElement('div');
  topbar.className = 'topbar';
  topbar.innerHTML = `<span>${state.user.email}</span><button class="link" id="logout-btn">ログアウト</button>`;
  app.appendChild(topbar);
  document.getElementById('logout-btn').onclick = () => auth.signOut();

  const bookBar = document.createElement('div');
  bookBar.className = 'book-bar';
  bookBar.innerHTML = `
    <select id="book-select">
      ${state.books.map(b => `<option value="${b.id}" ${b.id === state.currentBookId ? 'selected' : ''}>${b.name}</option>`).join('')}
    </select>
    <button class="secondary" id="book-new">新規帳簿</button>
    <button class="secondary" id="book-rename">名前変更</button>
    <button class="secondary" id="book-delete">削除</button>
  `;
  app.appendChild(bookBar);

  document.getElementById('book-select').onchange = (e) => {
    state.currentBookId = e.target.value;
    state.error = '';
    render();
  };
  document.getElementById('book-new').onclick = () => { state.modal = 'new-book'; render(); };
  document.getElementById('book-rename').onclick = () => { state.modal = 'rename-book'; render(); };
  document.getElementById('book-delete').onclick = () => { state.modal = 'delete-book'; render(); };

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  [
    ['entry', '仕訳入力'],
    ['journal', '仕訳帳'],
    ['ledger', '総勘定元帳'],
    ['statements', '財務諸表'],
    ['calendar', 'カレンダー'],
    ['periodsummary', '期間集計'],
    ['accounts', '科目管理'],
    ['trash', 'ゴミ箱'],
  ].forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (state.tab === key ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { state.tab = key; state.error = ''; render(); };
    tabs.appendChild(btn);
  });
  app.appendChild(tabs);

  if (state.error) {
    const err = document.createElement('div');
    err.className = 'error';
    err.textContent = state.error;
    app.appendChild(err);
  }

  if (state.tab === 'entry') renderEntry(app);
  else if (state.tab === 'journal') renderJournal(app);
  else if (state.tab === 'ledger') renderLedger(app);
  else if (state.tab === 'statements') renderStatements(app);
  else if (state.tab === 'calendar') renderCalendar(app);
  else if (state.tab === 'periodsummary') renderPeriodSummary(app);
  else if (state.tab === 'accounts') renderAccounts(app);
  else if (state.tab === 'trash') renderTrash(app);

  // 版表示と強制更新（更新が反映されているか確認するため）
  const ver = document.createElement('p');
  ver.className = 'muted';
  ver.style.cssText = 'font-size:11px; text-align:center; margin:8px 0 24px;';
  ver.innerHTML = `版: ${APP_BUILD} ／ <button class="link" style="color:#5f5e5a; text-decoration:underline; font-size:11px;" id="force-update">最新版に強制更新</button>`;
  app.appendChild(ver);
  document.getElementById('force-update').onclick = forceUpdateApp;

  if (state.modal) renderModal(app);

  state._renderedKey = state.tab === 'calendar' ? 'calendar:' + state.calendarView : state.tab;
  if (keepScroll) window.scrollTo(0, prevScrollY);
}

function closeEntryModal() {
  state.modal = state.returnModal || null;
  state.returnModal = null;
}

      </div>

    overlay.appendChild(modal);

      people: editPeople,
      placeholder: '名前を入力',
      onChange: (list) => { editPeople = list; },
    });
    document.getElementById('modal-save').onclick = async () => {
      editPeople = editPeopleWidget.commit();
      const date = document.getElementById('edit-date').value;
      const memo = document.getElementById('edit-memo').value.trim();
      const debit = document.getElementById('edit-debit').value;
      const credit = document.getElementById('edit-credit').value;
      const amount = parseFloat(document.getElementById('edit-amount').value);

      state.error = '';
      const fail = (msg) => {
        state.entryDraft = { date, memo, debit, credit, amount: document.getElementById('edit-amount').value, people: editPeople.slice() };
        state.error = msg;
        render();
      };
      if (!date) { fail('日付を入力してください。'); return; }
      if (debit === credit) { fail('借方と貸方に同じ科目は使えません。'); return; }
      if (!amount || amount <= 0) { fail('金額は正の数で入力してください。'); return; }

      state.entryDraft = null;
      entry.date = date;
      entry.memo = memo;
      entry.people = editPeople.slice();
      entry.debit = debit;
      entry.credit = credit;
      entry.amount = amount;
      book.entries.sort((a, b) => a.date.localeCompare(b.date));
      await saveUserData();
      state.editingEntryId = null;
      closeEntryModal();
      render();
    };
    document.getElementById('modal-cancel').onclick = () => { state.editingEntryId = null; state.entryDraft = null; state.error = ''; closeEntryModal(); render(); };
  }
}

// ===== 人物（誰といたときの費用か） =====
function escHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 検索用の正規化: 全角半角・大文字小文字・カタカナ/ひらがなの差を吸収
function normText(str) {
  return String(str || '').normalize('NFKC').toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
// これまでに入力された人物を、使用回数の多い順に返す（全帳簿・ゴミ箱内の仕訳も含む）
function allPeopleStats() {
  const stats = new Map(); // key -> { name, count, last }
  state.books.forEach(b => {
    (b.entries || []).concat(b.trash || []).forEach(e => {
      (e.people || []).forEach(name => {
        const key = normText(name);
        if (!key) return;
        const cur = stats.get(key) || { name, count: 0, last: '' };
        cur.count += 1;
        if (e.date > cur.last) { cur.last = e.date; cur.name = name; }
        stats.set(key, cur);
      });
    });
  });
  return Array.from(stats.values()).sort((a, b) => b.count - a.count || b.last.localeCompare(a.last));
}
function peopleLineHtml(e) {
  return (e && e.people && e.people.length) ? `<div class="ppl-line">👥 ${e.people.map(escHtml).join('、')}</div>` : '';
}

// 人物入力ウィジェット（チップ＋候補）。再描画せず局所的に更新する。
// opts: { people: [], onChange(list), placeholder, allowNew }
function mountPeopleInput(host, opts) {
  const allowNew = opts.allowNew !== false;
  let list = (opts.people || []).slice();
  let composing = false;
  let active = -1;
  let shown = [];
  host.innerHTML = `
    <div class="ppl-box"></div>
    <div class="ppl-suggest"></div>
  `;
  const box = host.querySelector('.ppl-box');
  const sugg = host.querySelector('.ppl-suggest');
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = opts.placeholder || '名前を入力';
  input.autocomplete = 'off';
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'ppl-add';
  addBtn.textContent = '追加';

  function has(name) { const k = normText(name); return list.some(n => normText(n) === k); }
  function changed() { opts.onChange && opts.onChange(list.slice()); }
  function add(name) {
    name = String(name || '').trim();
    if (!name) return;
    if (!has(name)) {
      // 既存の人物と表記ゆれ（ひらがな/カタカナ等）が一致するなら、既存の表記に揃える
      const known = allPeopleStats().find(x => normText(x.name) === normText(name));
      list.push(known ? known.name : name);
      changed();
    }
    input.value = '';
    active = -1;
    drawChips();
    drawSuggest();
  }
  function remove(i) { list.splice(i, 1); changed(); drawChips(); drawSuggest(); }

  function drawChips() {
    box.innerHTML = '';
    list.forEach((name, i) => {
      const chip = document.createElement('span');
      chip.className = 'ppl-chip';
      chip.appendChild(document.createTextNode(name));
      const x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', name + 'を外す');
      x.onclick = () => { remove(i); input.focus(); };
      chip.appendChild(x);
      box.appendChild(chip);
    });
    box.appendChild(input);
    box.appendChild(addBtn);
  }

  function drawSuggest() {
    const q = normText(input.value.trim());
    const stats = allPeopleStats().filter(x => !has(x.name));
    let items;
    let label = '';
    if (!q) {
      items = stats.slice(0, 8).map(x => ({ name: x.name, isNew: false }));
      label = items.length ? 'これまでの人物' : '';
    } else {
      items = stats.filter(x => normText(x.name).includes(q)).slice(0, 8).map(x => ({ name: x.name, isNew: false }));
      const exact = stats.some(x => normText(x.name) === q) || has(input.value);
      if (allowNew && !exact) items.push({ name: input.value.trim(), isNew: true });
      label = '候補';
    }
    shown = items;
    if (active >= items.length) active = items.length - 1;
    sugg.innerHTML = '';
    if (!items.length) return;
    if (label) { const l = document.createElement('span'); l.className = 'lbl'; l.textContent = label; sugg.appendChild(l); }
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ppl-pill' + (it.isNew ? ' new' : '') + (i === active ? ' active' : '');
      b.textContent = it.isNew ? `「${it.name}」を追加` : it.name;
      // フォーカスを失わないよう pointerdown で確定
      b.onpointerdown = (ev) => { ev.preventDefault(); };
      b.onclick = () => { add(it.name); input.focus(); };
      sugg.appendChild(b);
    });
  }

  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; drawSuggest(); });
  input.addEventListener('input', () => { active = -1; drawSuggest(); });
  input.addEventListener('focus', drawSuggest);
  input.addEventListener('keydown', (ev) => {
    if (composing || ev.isComposing || ev.keyCode === 229) return; // IME変換中のEnterは無視
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (active >= 0 && shown[active]) add(shown[active].name);
      else if (input.value.trim()) {
        if (allowNew) add(input.value);
        else if (shown.length) add(shown[0].name);
      }
    } else if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      if (shown.length) { active = (active + 1) % shown.length; drawSuggest(); }
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (shown.length) { active = (active - 1 + shown.length) % shown.length; drawSuggest(); }
    } else if (ev.key === 'Backspace' && !input.value && list.length) {
      remove(list.length - 1);
    }
  });
  addBtn.onclick = () => {
    if (input.value.trim()) { if (allowNew) add(input.value); else if (shown.length) add(shown[0].name); }
    input.focus();
  };

  drawChips();
  drawSuggest();
  // 入力欄に未確定の文字があれば確定して現在のリストを返す
  return {
    commit() {
      if (input.value.trim() && allowNew) add(input.value);
      return list.slice();
    },
  };
}

function journalSearchActive() {
  return !!(state.journalQuery.trim() || state.journalPeople.length);
}

// 摘要（スペース区切りでAND・ゆるい一致）と人物（AND）で絞り込む。検索中は期間指定を無視して全期間が対象
function journalFilteredEntries() {
  const base = filteredEntries(); // 期間指定（開始日・終了日）は検索時も適用する
  if (!journalSearchActive()) return base;
  const terms = normText(state.journalQuery).split(/\s+/).filter(Boolean);
  const pKeys = state.journalPeople.map(normText);
  return base.filter(e => {
    const memo = normText(e.memo);
    if (!terms.every(t => memo.includes(t))) return false;
    if (pKeys.length) {
      const keys = (e.people || []).map(normText);
      if (!pKeys.every(k => keys.includes(k))) return false;
    }
    return true;
  });
}

function truncateMemo(memo) {
  if (!memo) return '(なし)';
  return memo.length > 12 ? memo.slice(0, 12) + '…' : memo;

function computeBalances(entries, book) {
  const map = {};
  book.accounts.forEach(a => { map[a.name] = { type: a.type, debit: 0, credit: 0 }; });
  entries.forEach(e => {
    if (map[e.debit]) map[e.debit].debit += e.amount;
    if (map[e.credit]) map[e.credit].credit += e.amount;
  });
  const result = {};
  Object.entries(map).forEach(([name, v]) => {
    const net = normalDebit(v.type) ? v.debit - v.credit : v.credit - v.debit;
    result[name] = { type: v.type, debit: v.debit, credit: v.credit, balance: net };
  });
  return result;
}

// 指定した仕訳群について、科目区分ごとの増加額・減少額を集計する
// 「増加」「減少」はその区分の正常残高方向を基準にする
// (資産・費用は借方=増加、負債・純資産・収益は貸方=増加)
function accountTypeDeltaSummary(entries, book) {
  const summary = {};
  TYPE_ORDER.forEach(t => { summary[t] = { increase: 0, decrease: 0 }; });
  const accByName = {};
  book.accounts.forEach(a => { accByName[a.name] = a; });

  entries.forEach(e => {
    const debitAcc = accByName[e.debit];
    const creditAcc = accByName[e.credit];
    if (debitAcc) {
      if (normalDebit(debitAcc.type)) summary[debitAcc.type].increase += e.amount;
      else summary[debitAcc.type].decrease += e.amount;
    }
    if (creditAcc) {
      if (normalDebit(creditAcc.type)) summary[creditAcc.type].decrease += e.amount;
      else summary[creditAcc.type].increase += e.amount;
    }
  });
  return summary;
}

// カレンダー: 各日の資産の増加額・減少額を算出
function assetDeltaByDate(book) {
  const map = {};
  const assetNames = new Set(book.accounts.filter(a => a.type === 'asset').map(a => a.name));
  book.entries.forEach(e => {
    if (!map[e.date]) map[e.date] = { increase: 0, decrease: 0 };
    if (assetNames.has(e.debit)) map[e.date].increase += e.amount;
    if (assetNames.has(e.credit)) map[e.date].decrease += e.amount;
  });
  return map;
}

// 期間内の仕訳を返す
function entriesInRange(book, start, end) {
  return book.entries.filter(e => e.date >= start && e.date <= end);
}

// 期間全体の資産の増加・減少と件数
function assetDeltaForRange(book, start, end) {
  const assetNames = new Set(book.accounts.filter(a => a.type === 'asset').map(a => a.name));
  const r = { increase: 0, decrease: 0, count: 0 };
  entriesInRange(book, start, end).forEach(e => {
    r.count += 1;
    if (assetNames.has(e.debit)) r.increase += e.amount;
    if (assetNames.has(e.credit)) r.decrease += e.amount;
  });
  return r;
}

function currentWeekRange() {
  const s = startOfWeek(state.calendarAnchor);
  return { start: s, end: addDays(s, 6) };
}
function currentMonthRange() {
  const d = strToDate(state.calendarAnchor);
  const start = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-01';
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return { start, end: d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(last) };
}

function calendarRangeLabel() {
  const anchor = state.calendarAnchor;
  if (state.calendarView === 'day') {
    const d = strToDate(anchor);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${DOW_LABELS[d.getDay()]}）`;
  }
  if (state.calendarView === 'week') {
    const s = strToDate(startOfWeek(anchor));
    const e = strToDate(addDays(startOfWeek(anchor), 6));
    const sameYear = s.getFullYear() === e.getFullYear();
    return `${s.getFullYear()}年${s.getMonth() + 1}月${s.getDate()}日 〜 ${sameYear ? '' : e.getFullYear() + '年'}${e.getMonth() + 1}月${e.getDate()}日`;
  }
  const d = strToDate(anchor);
  return `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
}

function shiftCalendar(direction) {
  const v = state.calendarView;
  if (v === 'day') state.calendarAnchor = addDays(state.calendarAnchor, direction);
  else if (v === 'week') state.calendarAnchor = addDays(state.calendarAnchor, 7 * direction);
  else state.calendarAnchor = addMonths(state.calendarAnchor, direction);
  render();
}

// 週の表示ラベル（モーダルのタイトル用）
function weekLabelOf(weekStart) {
  const s = strToDate(weekStart);
  const e = strToDate(addDays(weekStart, 6));
  const sameYear = s.getFullYear() === e.getFullYear();
  return `${s.getFullYear()}年${s.getMonth() + 1}月${s.getDate()}日 〜 ${sameYear ? '' : e.getFullYear() + '年'}${e.getMonth() + 1}月${e.getDate()}日`;
}

// 週ごとの資産増減を一括集計し、新しい週→古い週の配列で返す
function buildWeekList(book) {
  const assetNames = new Set(book.accounts.filter(a => a.type === 'asset').map(a => a.name));
  const map = {};
  let minDate = null, maxDate = null;
  book.entries.forEach(e => {
    const ws = startOfWeek(e.date);
    const w = map[ws] || (map[ws] = { increase: 0, decrease: 0, count: 0 });
    w.count += 1;
    if (assetNames.has(e.debit)) w.increase += e.amount;
    if (assetNames.has(e.credit)) w.decrease += e.amount;
    if (minDate === null || e.date < minDate) minDate = e.date;
    if (maxDate === null || e.date > maxDate) maxDate = e.date;
  });
  const today = todayStr();
  const top = startOfWeek(maxDate && maxDate > today ? maxDate : today);
  const fallbackBottom = addDays(startOfWeek(today), -7 * 11); // 最低でも直近12週は表示
  const bottom = startOfWeek(minDate && minDate < fallbackBottom ? minDate : fallbackBottom);
  const list = [];
  for (let ws = top; ws >= bottom; ws = addDays(ws, -7)) {
    const w = map[ws] || { increase: 0, decrease: 0, count: 0 };
    list.push({ start: ws, end: addDays(ws, 6), ...w });
  }
  return list;
}

function deltaHtml(delta) {
  if (!delta || (!delta.increase && !delta.decrease)) return '';
  return `
    <div class="cal-delta-plus">+${fmt(delta.increase)}</div>
    <div class="cal-delta-minus">-${fmt(delta.decrease)}</div>
  `;
}

  }

  const card = document.createElement('div');

  if (view === 'month') {
    // 横スワイプで前月・翌月へ移動（左スワイプ=翌月、右スワイプ=前月）
    card.classList.add('swipe-area');
    if (state.calSlide) { card.classList.add('slide-' + state.calSlide); state.calSlide = null; }
    let sx = 0, sy = 0, tracking = false;
    card.addEventListener('touchstart', (ev) => {
      if (ev.touches.length !== 1) { tracking = false; return; }
      sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; tracking = true;
    }, { passive: true });
    card.addEventListener('touchend', (ev) => {
      if (!tracking) return;
      tracking = false;
      const t = ev.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const dir = dx < 0 ? 1 : -1;
        state.calSlide = dir > 0 ? 'next' : 'prev';
        shiftCalendar(dir);
      }

    const anchor = strToDate(state.calendarAnchor);

    const grid = document.createElement('div');

      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const startWeekday = new Date(year, month, 1).getDay(); // 0=日曜

    for (let i = 0; i < startWeekday; i++) {

      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {

  } else if (view === 'week') {

    card.classList.add('week-list-card');
    const currentWeek = startOfWeek(today);
    buildWeekList(book).forEach(w => {
      const s = strToDate(w.start), e = strToDate(w.end);
      const net = w.increase - w.decrease;
      const netCls = net > 0 ? 'cal-delta-plus' : net < 0 ? 'cal-delta-minus' : 'week-net-zero';
      const yearText = s.getFullYear() === e.getFullYear() ? `${s.getFullYear()}年` : `${s.getFullYear()}年〜${e.getFullYear()}年`;
      const row = document.createElement('div');

        </div>
        <div class="week-card-right">
          <div class="week-card-net ${netCls}">${net > 0 ? '+' : net < 0 ? '-' : ''}${fmt(Math.abs(net))}</div>
          <div class="week-card-detail">
            <span class="cal-delta-plus">+${fmt(w.increase)}</span>
            <span class="cal-delta-minus">-${fmt(w.decrease)}</span>
          </div>
        </div>
      `;
      row.onclick = () => openRangeSummary(w.start, w.end, weekLabelOf(w.start));

        </div>

    : view === 'month'

      : '数字は資産勘定の増加額（緑）・減少額（赤）。日付をタップすると、その日の科目別増減と仕訳を確認できる。';
  app.appendChild(note);
}

      </div>

      <div style="margin-bottom:32px;">
        <h2 style="font-size:16px; border-bottom:2px solid #1a1a1a; padding-bottom:4px;">仕訳帳</h2>
        ${entries.length === 0 ? '<p style="font-size:13px; color:#888;">この期間の仕訳はありません。</p>' : `
        <table style="width:100%; border-collapse:collapse; font-size:12px; margin-top:8px;">
          <thead>
            <tr>
              <th style="text-align:left; padding:4px 6px; border-bottom:1px solid #888;">日付</th>
              <th style="text-align:left; padding:4px 6px; border-bottom:1px solid #888;">借方</th>
              <th style="text-align:left; padding:4px 6px; border-bottom:1px solid #888;">貸方</th>
              <th style="text-align:right; padding:4px 6px; border-bottom:1px solid #888;">金額</th>
              <th style="text-align:left; padding:4px 6px; border-bottom:1px solid #888;">摘要</th>
            </tr>
          </thead>
          <tbody>${journalRows}</tbody>
        </table>
        `}
      </div>

      <div style="margin-bottom:32px;">
        <h2 style="font-size:16px; border-bottom:2px solid #1a1a1a; padding-bottom:4px;">総勘定元帳</h2>
        ${ledgerHtml || '<p style="font-size:13px; color:#888;">データがありません。</p>'}
      </div>

      <div>
        <h2 style="font-size:16px; border-bottom:2px solid #1a1a1a; padding-bottom:4px;">財務諸表</h2>
        <h3 style="font-size:14px; margin:16px 0 6px;">貸借対照表</h3>
        <div style="display:flex; gap:24px;">
          <div style="flex:1;">
            <p style="font-size:12px; color:#5f5e5a; margin:0 0 6px;">資産</p>
            ${assetRowsHtml}
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; border-top:1px solid #888; margin-top:4px; padding-top:4px;"><span>資産合計</span><span>${fmt(assets)}</span></div>
          </div>
          <div style="flex:1;">
            <p style="font-size:12px; color:#5f5e5a; margin:0 0 6px;">負債・純資産</p>
            ${liabRowsHtml}
            <div style="display:flex; justify-content:space-between; font-size:12px; padding:2px 0;"><span>当期純利益（繰入）</span><span>${fmt(netIncome)}</span></div>
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; border-top:1px solid #888; margin-top:4px; padding-top:4px;"><span>負債・純資産合計</span><span>${fmt(liabilities + netIncome)}</span></div>
          </div>
        </div>
        <h3 style="font-size:14px; margin:20px 0 6px;">損益計算書</h3>
        <div style="display:flex; justify-content:space-between; font-size:12px; padding:2px 0;"><span>収益合計</span><span>${fmt(revenue)}</span></div>
        <div style="display:flex; justify-content:space-between; font-size:12px; padding:2px 0;"><span>費用合計</span><span>${fmt(expense)}</span></div>
        <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600; border-top:1px solid #888; margin-top:4px; padding-top:4px;"><span>当期純利益</span><span>${fmt(netIncome)}</span></div>
      </div>
    `;

    document.body.appendChild(container);

    const canvas = await html2canvas(container, { scale: 2, useCORS: true });
    document.body.removeChild(container);

    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = 210;
    const pageHeight = 297;
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;

    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    const fileName = `${book.name}_${rangeLabel}_仕訳帳・総勘定元帳・財務諸表.pdf`;
    pdf.save(fileName);
  } catch (err) {
    state.error = 'PDF生成に失敗しました: ' + err.message;
  }

  state.pdfExporting = false;
  render();
}

function renderTrash(app) {
  const book = currentBook();
  const trash = book.trash || [];
  const card = document.createElement('div');
  card.className = 'card';

  if (trash.length === 0) {
    card.innerHTML = '<p class="muted">ゴミ箱は空です。</p>';
    app.appendChild(card);
    return;
  }

  const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();

  let rows = trash.map(e => {
    const deletedAt = new Date(e.deletedAt).getTime();
    const daysLeft = Math.max(0, Math.ceil((THIRTY_DAYS_MS - (now - deletedAt)) / (24 * 60 * 60 * 1000)));
    return `
      <tr>
        <td>${e.date}</td>
        <td>${e.debit}</td>
        <td>${e.credit}</td>
        <td class="num">${fmt(e.amount)}</td>
        <td style="color:#5f5e5a;">${truncateMemo(e.memo)}${peopleLineHtml(e)}</td>
        <td style="color:#888780; font-size:12px;">残り${daysLeft}日</td>
        <td>
          <button class="link" style="color:#1b7a3d;" data-restore-id="${e.id}">復元</button>
          <button class="link" data-purge-id="${e.id}">完全削除</button>
        </td>
      </tr>
    `;
  }).join('');

  card.innerHTML = `
    <p class="muted" style="font-size:12px;">削除した仕訳は30日間ここに保存され、その後自動的に完全削除される。</p>
    <table>
      <thead><tr><th>日付</th><th>借方</th><th>貸方</th><th class="num">金額</th><th>摘要</th><th>期限</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  app.appendChild(card);

  card.querySelectorAll('[data-restore-id]').forEach(btn => {
    btn.onclick = async () => {
      const idx = book.trash.findIndex(e => e.id === btn.dataset.restoreId);
      if (idx === -1) return;
      const [restored] = book.trash.splice(idx, 1);
      delete restored.deletedAt;
      book.entries.push(restored);
      book.entries.sort((a, b) => a.date.localeCompare(b.date));
      await saveUserData();
      render();
    };
  });

  card.querySelectorAll('[data-purge-id]').forEach(btn => {
    btn.onclick = () => {
      state.confirmPurgeId = btn.dataset.purgeId;
      state.modal = 'confirm-purge';
      render();
    };
  });
}

function renderAccounts(app) {
  const book = currentBook();
  const formCard = document.createElement('div');
  formCard.className = 'card';
  formCard.innerHTML = `
    <div class="row">
      <div class="field">
        <label>科目名</label>
        <input type="text" id="a-name" value="${state.accForm.name}" placeholder="書籍代">
      </div>
      <div class="field">
        <label>区分</label>
        <select id="a-type">${TYPE_ORDER.map(t => `<option value="${t}" ${t === state.accForm.type ? 'selected' : ''}>${TYPE_LABEL[t]}</option>`).join('')}</select>
      </div>
    </div>
    <button class="primary" id="a-submit">科目を追加</button>
  `;
  app.appendChild(formCard);

  document.getElementById('a-submit').onclick = async () => {
    const name = document.getElementById('a-name').value.trim();
    const type = document.getElementById('a-type').value;
    state.error = '';
    if (!name) { state.error = '科目名を入力してください。'; render(); return; }
    if (book.accounts.some(a => a.name === name)) { state.error = '同じ名前の科目が既に存在します。'; render(); return; }
    book.accounts.push({ id: uid(), name, type });
    await saveUserData();
    state.accForm = { name: '', type: 'expense' };
    render();
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  let rows = book.accounts.map(a => `
    <tr>
      <td>${a.name}</td>
      <td style="color:#5f5e5a;">${TYPE_LABEL[a.type]}</td>
      <td>
        <button class="link" data-edit-id="${a.id}" style="color:#1a1a1a;">編集</button>
        <button class="link" data-id="${a.id}">削除</button>
      </td>
    </tr>
  `).join('');
  listCard.innerHTML = `
    <table>
      <thead><tr><th>科目名</th><th>区分</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  app.appendChild(listCard);

  listCard.querySelectorAll('button[data-edit-id]').forEach(btn => {
    btn.onclick = () => {
      state.editingAccountId = btn.dataset.editId;
      state.modal = 'edit-account';
      render();
    };
  });

  listCard.querySelectorAll('button.link[data-id]').forEach(btn => {
    btn.onclick = async () => {
      const acc = book.accounts.find(a => a.id === btn.dataset.id);
      if (!acc) return;
      const inUse = book.entries.some(e => e.debit === acc.name || e.credit === acc.name);
      state.error = '';
      if (inUse) { state.error = `科目「${acc.name}」は仕訳で使用されているため削除できません。`; render(); return; }
      book.accounts = book.accounts.filter(a => a.id !== acc.id);
      await saveUserData();
      render();
    };
  });
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    state.user = user;
    renderLoading('データを読み込んでいます...');
    await loadUserData();
    render();
  } else {
    state.user = null;
    render();
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg) {
    reg.update().catch(function() {});
  }).catch(function() {});
  // 新しいサービスワーカーに切り替わったら、自動で読み込み直して最新版を表示する
  var swReloaded = false;
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (!hadController || swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}
